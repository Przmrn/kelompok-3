<section class="container py-5" style="max-width: 520px;">
  <div class="k-card p-4">
    <h1 class="h3 fw-bold">Masuk ke CodeAcademia</h1>
    <p class="text-secondary">Masuk untuk melanjutkan ke halaman akun Anda.</p>
    <form (submit)="$event.preventDefault(); login(email.value, password.value)">
      <fieldset [disabled]="busy()">
        <div class="mb-3">
          <label for="page-login-email" class="k-label">Email</label>
          <input #email id="page-login-email" name="email" type="email" autocomplete="username" class="form-control k-input" required>
        </div>
        <div class="mb-3">
          <label for="page-login-password" class="k-label">Kata sandi</label>
          <input #password id="page-login-password" name="password" type="password" autocomplete="current-password" class="form-control k-input" required>
        </div>
        @if (error()) { <p role="alert" class="alert alert-danger">{{ error() }}</p> }
        <button type="submit" class="btn-k-primary w-100">{{ busy() ? 'Sedang masuk…' : 'Masuk' }}</button>
        <button type="button" class="btn-k-light w-100 mt-3" (click)="svc.openAuthModal('REGISTER')">Buat akun peserta</button>
      </fieldset>
    </form>
  </div>
</section>
